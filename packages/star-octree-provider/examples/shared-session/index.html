<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Octree Provider: Shared Session</title>
    <link rel="stylesheet" href="../../../../demos/shared.css" />
    <link rel="stylesheet" href="./shared-session.css" />
  </head>
  <body>
    <aside>
      <p class="breadcrumb"><a href="../../../../index.html">SkyKit lessons</a> <span>/ Shared sessions</span></p>
      <h1>Shared Sessions</h1>
      <p>
        One provider can back multiple sessions. Each consumer owns how it
        applies cell deltas.
      </p>
      <button type="button" data-run>Run two sessions</button>
      <p class="status" data-status>ready</p>
    </aside>
    <main>
      <div class="viewer-grid">
        <pre data-a>Session A</pre>
        <pre data-b>Session B</pre>
      </div>
      <pre data-provider>Provider snapshot</pre>
    </main>
    <script type="module" src="./shared-session.js"></script>
  </body>
</html>
