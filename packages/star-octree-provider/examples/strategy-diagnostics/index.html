<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Octree Provider: Strategy Diagnostics</title>
    <link rel="stylesheet" href="../../../../demos/shared.css" />
    <link rel="stylesheet" href="./strategy-diagnostics.css" />
  </head>
  <body>
    <aside>
      <p class="breadcrumb"><a href="../../../../index.html">SkyKit examples</a> <span>/ Strategy diagnostics</span></p>
      <h1>Strategy Diagnostics</h1>
      <p>
        Strategies say which nodes matter. The provider planner still decides
        how to fetch payload ranges efficiently.
      </p>
      <button type="button" data-run>Run diagnostics</button>
      <p class="status" data-status>ready</p>
    </aside>
    <main>
      <table>
        <thead>
          <tr>
            <th>Strategy</th>
            <th>Selected</th>
            <th>Pruned</th>
            <th>Prefetch</th>
            <th>Levels</th>
            <th>Fetched</th>
            <th>Bytes</th>
          </tr>
        </thead>
        <tbody data-results></tbody>
      </table>
      <pre data-log>Click run to inspect demand without touching octree internals.</pre>
    </main>
    <script type="module" src="./strategy-diagnostics.js"></script>
  </body>
</html>
