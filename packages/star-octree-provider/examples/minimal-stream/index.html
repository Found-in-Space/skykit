<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Octree Provider: Browser Scratchpad</title>
    <link rel="stylesheet" href="../../../../demos/shared.css" />
    <link rel="stylesheet" href="./minimal-stream.css" />
  </head>
  <body>
    <main>
      <header class="page-header">
        <div>
          <nav class="breadcrumb">
            <a href="../../../../index.html">SkyKit</a>
            <span>/ Star Octree Provider</span>
          </nav>
          <h1>Provider Scratchpad</h1>
        </div>
        <div class="page-actions">
          <button type="button" data-run-all>Run all cells</button>
          <button type="button" data-reset>Reset cells</button>
          <p class="status">Status: <span data-status>ready</span></p>
        </div>
      </header>

      <section class="scratchpad">
        <section class="notebook" data-notebook></section>

        <section class="result-panel">
          <h2>Rendered Rows</h2>
          <div class="cell-summary" data-cell-summary></div>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Cell</th>
                  <th>Node</th>
                  <th>Ordinal</th>
                  <th>Position pc</th>
                  <th>Abs mag</th>
                  <th>Teff K</th>
                </tr>
              </thead>
              <tbody data-stars>
                <tr>
                  <td colspan="7" class="empty-row">Run the cells to render rows.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="./minimal-stream.js"></script>
  </body>
</html>
