<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Map Canvas: Use Cases</title>
    <link rel="stylesheet" href="../../../../demos/shared.css" />
    <link rel="stylesheet" href="./use-cases.css" />
  </head>
  <body>
    <aside>
      <nav class="breadcrumb">
        <a href="../../../../index.html">SkyKit</a>
        <span>/ Star Map Canvas</span>
      </nav>
      <h1>Canvas Use Cases</h1>

      <form data-query-form>
        <label for="octree-url">Octree URL</label>
        <input id="octree-url" name="url" type="url" data-url />

        <div class="coordinate-grid" aria-label="Observer coordinates in parsecs">
          <label>
            X pc
            <input name="x" type="number" step="1" value="0" data-x />
          </label>
          <label>
            Y pc
            <input name="y" type="number" step="1" value="0" data-y />
          </label>
          <label>
            Z pc
            <input name="z" type="number" step="1" value="0" data-z />
          </label>
        </div>

        <label for="magnitude">Apparent magnitude limit</label>
        <input id="magnitude" name="magnitude" type="number" step="0.1" value="6.5" data-magnitude />

        <label for="projection">Projection</label>
        <select id="projection" data-projection>
          <option value="all-sky">RA/Dec all-sky</option>
          <option value="fov">FoV chart</option>
        </select>

        <div class="coordinate-grid" aria-label="Field of view projection settings">
          <label>
            RA deg
            <input name="center-ra" type="number" step="1" value="83" data-center-ra />
          </label>
          <label>
            Dec deg
            <input name="center-dec" type="number" step="1" value="-5" data-center-dec />
          </label>
          <label>
            FoV deg
            <input name="fov" type="number" step="1" value="70" data-fov />
          </label>
        </div>

        <label for="motion">Point transform</label>
        <select id="motion" data-motion>
          <option value="static">Static</option>
          <option value="twinkle">Twinkle</option>
          <option value="fall">Fall into pile</option>
        </select>

        <div class="toggle-grid">
          <label><input type="checkbox" data-glyph /> Glyphs</label>
          <label><input type="checkbox" data-grid checked /> RA/Dec grid</label>
          <label><input type="checkbox" data-art checked /> Anchored image</label>
        </div>

        <div class="controls">
          <button type="submit">Apply view</button>
          <button type="button" data-reset>Reset origin</button>
        </div>
      </form>

      <p class="status">Status: <span data-status>idle</span></p>
      <div class="selected" data-selected>No star selected.</div>
    </aside>

    <main>
      <section class="map-shell" aria-label="Observer-relative 2D star map">
        <div class="map-toolbar">
          <div class="metric">
            <span>Store stars</span>
            <strong data-store-count>0</strong>
          </div>
          <div class="metric">
            <span>Visible</span>
            <strong data-visible-count>0</strong>
          </div>
          <div class="metric">
            <span>Products</span>
            <strong data-product-count>0</strong>
          </div>
          <div class="metric">
            <span>Demand</span>
            <strong data-demand-state>idle</strong>
          </div>
        </div>
        <canvas data-star-map aria-label="Star map canvas use cases"></canvas>
      </section>
      <section class="projection-panel">
        <h2>ProjectedStarMap</h2>
        <pre data-projection-preview>{}</pre>
      </section>
    </main>

    <script type="module" src="./use-cases.js"></script>
  </body>
</html>
