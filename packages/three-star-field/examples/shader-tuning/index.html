<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three Star Field: Shader Tuning</title>
    <link rel="stylesheet" href="../../../../demos/shared.css" />
    <link rel="stylesheet" href="./shader-tuning.css" />
  </head>
  <body>
    <aside>
      <p class="breadcrumb"><a href="../../../../index.html">SkyKit lessons</a> <span>/ Shader tuning</span></p>
      <h1>Shader Tuning</h1>
      <p>Change the renderer view. Star data stays untouched.</p>
      <label>Limiting magnitude <input data-mag type="number" min="-2" max="12" step="0.1" value="6.5" /></label>
      <label>Exposure <input data-exposure type="number" min="100" max="8000" step="100" value="2500" /></label>
      <label>Base size <input data-size type="number" min="0.1" max="6" step="0.1" value="0.9" /></label>
      <pre data-snapshot></pre>
    </aside>
    <main>
      <div class="viewer-shell" data-viewer></div>
    </main>
    <script type="module" src="./shader-tuning.js"></script>
  </body>
</html>
