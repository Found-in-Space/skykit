<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyKit Examples</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #02040b;
        color: #e6f0ff;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        box-sizing: border-box;
      }

      main {
        width: min(760px, 100%);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 3rem;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 28px;
        color: #9fb5d4;
        font-size: 1rem;
        line-height: 1.6;
      }

      nav {
        display: grid;
        gap: 12px;
      }

      a {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 18px;
        border: 1px solid rgba(133, 180, 255, 0.24);
        border-radius: 8px;
        color: inherit;
        text-decoration: none;
        background: rgba(8, 16, 28, 0.86);
      }

      a:hover,
      a:focus-visible {
        border-color: rgba(125, 222, 255, 0.75);
        background: rgba(14, 30, 50, 0.96);
      }

      span {
        color: #9fb5d4;
      }

      @media (max-width: 640px) {
        h1 {
          font-size: 2.2rem;
        }

        a {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SkyKit Examples</h1>
      <p>Standalone alpha examples that compose published SkyKit packages and app-owned dependencies.</p>
      <nav>
        <a href="./free-roam/">Free Roam <span>streamed stars and constellation art</span></a>
        <a href="./xr-free-roam/">XR Free Roam <span>WebXR navigation and panels</span></a>
      </nav>
    </main>
  </body>
</html>
