# Build demo bundles with Vite and deploy to GitHub Pages (project site: /skykit/).
#
# Repo settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          SKYKIT_PUBLIC_BASE: /skykit/
      - name: Verify demo artifact pages
        run: |
          test -f dist/index.html
          test -f dist/apps/examples/free-roam/index.html
          test -f dist/apps/examples/xr-free-roam/index.html
          test -f dist/packages/spatial/examples/index.html
          test -f dist/packages/spatial/examples/coordinates-aim/index.html
          test -f dist/packages/spatial/examples/routes-orbits/index.html
          test -f dist/packages/spatial/examples/paths-transitions/index.html
          test -f dist/packages/spatial/examples/motion-automation/index.html
          test -f dist/demos/dust-roam.html
          test -f dist/demos/h-alpha-volume.html
          npm run verify:pages-urls -- dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
