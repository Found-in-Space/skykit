name: Release packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - name: Install Chromium for the browser smoke test
        run: npx playwright install --with-deps chromium
      - run: npm run release:check-touch-os
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:examples
      - run: npm run test:browser:xr-free-roam
      - run: npm run release:check-lockfile
      - run: npm run release:check-packed-consumers
      - name: Check pushed patches for whitespace errors
        if: github.event_name == 'push'
        run: git log --check --oneline "${{ github.event.before }}..${{ github.sha }}"
      - name: Check the dispatched commit for whitespace errors
        if: github.event_name == 'workflow_dispatch'
        run: git log -1 --check --oneline

      - uses: changesets/action@v1
        with:
          version: npm run release:version
          publish: npm run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
